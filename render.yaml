services:
  # Backend Service (Node.js on Render)
  - type: web
    name: decoraai-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: SUPABASE_URL
        sync: false # Set in Render dashboard: https://your-project.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set in Render dashboard (from Supabase > Settings > API > service_role)
      - key: TRIPO_API_KEY
        sync: false # Set in Render dashboard (from https://platform.tripo3d.ai)
      - key: FRONTEND_URL
        sync: false # Set in Render dashboard: https://your-app.netlify.app

  # Frontend Service (Static site — Netlify is preferred; use this if deploying on Render)
  - type: static
    name: decoraai-frontend
    env: static
    rootDir: frontend
    buildCommand: npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your backend Render URL e.g. https://decoraai-backend.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false # Set to: https://your-project.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # Set in dashboard (from Supabase > Settings > API > anon key)
